<section class="register">

  <div class="background-overlay"></div>

  <div class="form-box">

    <a href="">voltar</a>

    <div class="logo">
      📚 BiblioFlix
    </div>

    <h1>Criar Conta</h1>

    <p>
      Faça seu cadastro e aproveite os melhores livros digitais.
    </p>

    <div class="input-box">
      <span>👤</span>

      <input
        type="text"
        placeholder="Digite seu nome">
    </div>

    <div class="input-box">
      <span>👥</span>

      <input
        type="text"
        placeholder="Digite seu sobrenome">
    </div>

    <div class="input-box">
      <span>📧</span>

      <input
        type="email"
        placeholder="Digite seu email">
    </div>

    <div class="input-box">
      <span>🔒</span>

      <input
        type="password"
        placeholder="Digite sua senha">
    </div>

      <button class="btn-register" (click)="goToCreatebook()">
        Cadastrar
      </button>

    <div class="links">

      <span>
        Já possui conta?
      </span>

      <a  class="btn-primary" (click)="goToLogin()">
        Fazer login
      </a>
      

    </div>

  </div>

</section>
